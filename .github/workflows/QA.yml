name: QA

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-scraper-qa:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: scraper/pyproject.toml
          architecture: x64

      - name: Install dependencies
        working-directory: scraper
        run: |
          pip install -U pip
          pip install -e .[qa,scripts,test]

      - name: Check Linting
        working-directory: scraper
        run: inv check-lint

      - name: Check Formatting
        working-directory: scraper
        run: inv check-format

      - name: Check Type
        working-directory: scraper
        run: inv check-type

  check-zimui-qa:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: zimui/package.json

      - name: Enable Corepack
        working-directory: zimui
        run: corepack enable

      - name: Install JS dependencies
        working-directory: zimui
        run: yarn install --immutable

      - name: Check prettier
        working-directory: zimui
        run: |
          yarn format-check

      - name: Check eslint
        working-directory: zimui
        run: |
          yarn lint-check
